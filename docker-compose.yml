services:
  mongodb:
    image: mongo:7
    container_name: workcodile-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - workcodile-net

  minio:
    image: minio/minio
    container_name: workcodile-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin123}
    command: server /data --console-address ":9001"
    networks:
      - workcodile-net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-setup:
    image: minio/mc
    container_name: workcodile-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin123} &&
      mc anonymous set public local/${MINIO_BUCKET_NAME:-workcodile-files} &&
      mc admin config set local/ api cors_allow_origin='*' &&
      mc admin service restart local/ &&
      echo 'MinIO setup complete'
      "
    restart: "no"
    networks:
      - workcodile-net

  backend:
    build:
      context: ./backend
      target: development
    container_name: workcodile-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - ./backend/src:/app/src
      - /app/node_modules
    environment:
      NODE_ENV: development
      MONGO_URI: mongodb://mongodb:27017/workcodiledb
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-minio}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin123}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-workcodile-files}
      MINIO_PUBLIC_ENDPOINT: /files
      FRONTEND_URL: http://localhost:8000
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    depends_on:
      mongodb:
        condition: service_started
      minio:
        condition: service_healthy
    networks:
      - workcodile-net

  frontend:
    build:
      context: ./frontend
    container_name: workcodile-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - workcodile-net

  proxy:
    image: nginx:stable-alpine
    container_name: workcodile-proxy
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
      - minio
    networks:
      - workcodile-net

networks:
  workcodile-net:
    driver: bridge

volumes:
  mongodb_data:
  minio_data: